name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Core Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin pandas<3 until batch drift/psi.py updates np.issubdtype for StringDtype
          pip install -e . "pandas<3" pytest

      - name: Run test suite
        run: |
          pytest tests -q

  dependency-floor-probe:
    name: Streaming Dependency Floor Probe (Python 3.8)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install streaming dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[streaming]" "pandas<3" pytest

      - name: Verify Python 3.8 importability and streaming unit tests
        run: |
          python -c "import confluent_kafka, redis, msgpack; print('Python 3.8 dependencies verified successfully')"
          pytest tests/streaming -q
